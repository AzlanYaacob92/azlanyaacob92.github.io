<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemculator — Chemistry Learning Suite</title>
<link rel="icon" href="brand/favicon.ico" sizes="48x48">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="description" content="Chemculator: a growing suite of interactive chemistry tools. Chemculate concentrations, limiting reactants, and more.">

<!-- Flash-free theme init (identical across the suite): runs before first paint. -->
<script>
try{var s=localStorage.getItem('theme'); if(s==='dark'||s==='light') document.documentElement.setAttribute('data-theme', s);}catch(e){}
</script>

<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" type="button">🌙</button>

<header class="site-header">
  <span class="eyebrow">Chemistry Learning Suite</span>
  <h1 class="site-title">
    <img src="logo-light.svg" alt="Chemculator" class="site-logo site-logo--light">
    <img src="logo-dark.svg" alt="Chemculator" class="site-logo site-logo--dark">
  </h1>
</header>

<main>
  <div id="app-grid" class="card-grid" aria-live="polite">
    <!-- Cards are rendered here by app.js (from apps.json, with an embedded fallback) -->
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
